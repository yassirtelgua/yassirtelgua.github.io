<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Scroll Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
        }
        body {
            height: 500vh;
        }
        canvas {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <canvas id="animCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('animCanvas');
        const context = canvas.getContext('2d');
        const frameCount = 240;
        
        const currentFrame = index => (
            `ezgif-111b969181fa1c58-jpg/ezgif-frame-${index.toString().padStart(3, '0')}.jpg`
        );

        const images = [];
        for (let i = 1; i <= frameCount; i++) {
            const img = new Image();
            img.src = currentFrame(i);
            images.push(img);
        }

        images[0].onload = () => {
            canvas.width = images[0].width;
            canvas.height = images[0].height;
            context.drawImage(images[0], 0, 0);
        }

        window.addEventListener('scroll', () => {
            const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
            const scrollFraction = maxScrollTop > 0 ? scrollTop / maxScrollTop : 0;
            
            const frameIndex = Math.min(
                frameCount - 1,
                Math.floor(scrollFraction * frameCount)
            );
            
            requestAnimationFrame(() => {
                if (images[frameIndex] && images[frameIndex].complete) {
                    if (canvas.width !== images[frameIndex].width) {
                        canvas.width = images[frameIndex].width;
                        canvas.height = images[frameIndex].height;
                    }
                    context.drawImage(images[frameIndex], 0, 0);
                }
            });
        });
    </script>
</body>
</html>
