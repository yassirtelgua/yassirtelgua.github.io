<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Scroll Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow-x: hidden;
        }
        body {
            height: 500vh; /* Adjust scroll distance speed */
        }
        canvas {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <canvas id="animCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('animCanvas');
        const context = canvas.getContext('2d');
        
        // Update to match the exact number of uploaded frame images
        const frameCount = 33; 
        
        // Match the directory path inside your GitHub repository
        const currentFrame = index => (
            `./frames/ezgif-frame-${index.toString().padStart(3, '0')}.jpg`
        );

        const images = [];

        // Preload image sequence
        for (let i = 1; i <= frameCount; i++) {
            const img = new Image();
            img.src = currentFrame(i);
            images.push(img);
        }

        function renderFrame(index) {
            if (images[index] && images[index].complete) {
                context.clearRect(0, 0, canvas.width, canvas.height);
                context.drawImage(images[index], 0, 0);
            }
        }

        // Initialize canvas resolution on initial load
        images[0].onload = () => {
            canvas.width = images[0].naturalWidth;
            canvas.height = images[0].naturalHeight;
            renderFrame(0);
        };

        window.addEventListener('scroll', () => {
            const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
            const scrollFraction = maxScrollTop > 0 ? scrollTop / maxScrollTop : 0;
            
            const frameIndex = Math.min(
                frameCount - 1,
                Math.floor(scrollFraction * frameCount)
            );
            
            requestAnimationFrame(() => renderFrame(frameIndex));
        });
    </script>
</body>
</html>
